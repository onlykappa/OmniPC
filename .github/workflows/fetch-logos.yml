name: Fetch system logos (temporary)
on:
  push:
    branches: ['claude/logo-fetch']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/logos/fetch_commons.py scripts/logos/queries.json /tmp/logos
      - name: Push to claude/logo-assets
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan logo-assets && git rm -rqf . && mkdir -p logos && cp /tmp/logos/* logos/ && git add logos && git commit -qm "Fetched system logos" && git push -f origin HEAD:claude/logo-assets
