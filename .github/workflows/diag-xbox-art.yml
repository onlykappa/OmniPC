name: Diag Xbox art (temporary)
on:
  push:
    branches: ['claude/diag-xbox-art']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes esbuild@0.25.0 scripts/diag/xbox-art.ts --bundle --platform=node --format=cjs --alias:@shared=./src/shared --outfile=/tmp/diag.cjs
      - run: node /tmp/diag.cjs
        env:
          GH_TOKEN: ${{ github.token }}
