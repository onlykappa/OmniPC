name: Release

# Builds the Windows installer and attaches it to the GitHub Release for a tag
# like v1.0.0. Start it any of these ways:
#  - publish a release on GitHub (Releases > Draft a new release > new tag v1.0.0),
#  - push a v* tag,
#  - run it from the Actions tab with the tag name.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0 (created on the selected branch if missing)'
        required: true

permissions:
  contents: write

# Publishing a release from the UI fires both 'release' and the tag 'push'; build once.
concurrency:
  group: release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "Tag $TAG does not match package.json version $v"; exit 1; }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the self-update feed was generated
        shell: bash
        run: |
          test -f release/latest.yml || { echo "release/latest.yml missing: in-app updates would not find this release"; exit 1; }
          cat release/latest.yml
      - name: Checksums
        shell: bash
        run: cd release && sha256sum OmniPC-Setup-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \\[${TAG#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          [ -n "$notes" ] || notes="See CHANGELOG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (published from the GitHub UI): attach the build and the changelog notes.
            gh release upload "$TAG" release/OmniPC-Setup-*.exe release/OmniPC-Setup-*.exe.blockmap release/latest.yml release/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "OmniPC $TAG" --notes "$notes"
          else
            gh release create "$TAG" release/OmniPC-Setup-*.exe release/OmniPC-Setup-*.exe.blockmap release/latest.yml release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "OmniPC $TAG" --notes "$notes"
          fi
