# Windows installer (NSIS). Emulators are NOT bundled: OmniPC downloads the
# ones the user selects from their official sources during onboarding.
# Kept from before the rename to OmniPC so new installers upgrade existing installs in place.
appId: pc.omnideck.app
productName: OmniPC
copyright: Copyright © OmniPC contributors
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
  - "!**/*.map"
# better-sqlite3 ships N-API prebuilds for win32-x64, so no native rebuild is needed.
npmRebuild: false
asarUnpack:
  - node_modules/7zip-bin/**
  - node_modules/better-sqlite3/**
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE.txt
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: OmniPC-Setup-${version}.exe
  # Never run the whole app elevated; specific operations request elevation themselves.
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OmniPC
  # User data (games, saves, BIOS, emulators under %USERPROFILE%\OmniPC) is never removed on uninstall.
  deleteAppDataOnUninstall: false
# Self-update feed: electron-updater reads latest.yml from the newest GitHub release.
# Publishing itself is done by .github/workflows/release.yml (builds use --publish never).
publish:
  - provider: github
    owner: onlykappa
    repo: OmniPC
    releaseType: release
