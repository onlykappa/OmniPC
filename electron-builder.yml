# Windows installer (NSIS). Emulators are NOT bundled: OmniDeck downloads the
# ones the user selects from their official sources during onboarding.
appId: pc.omnideck.app
productName: OmniDeck PC
copyright: Copyright © OmniDeck PC contributors
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
  - "!**/*.map"
# better-sqlite3 ships N-API prebuilds for win32-x64, so no native rebuild is needed.
npmRebuild: false
asarUnpack:
  - node_modules/7zip-bin/**
  - node_modules/better-sqlite3/**
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE.txt
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: OmniDeck-Setup-${version}.exe
  # Never run the whole app elevated; specific operations request elevation themselves.
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OmniDeck PC
  # User data (games, saves, BIOS, emulators under %USERPROFILE%\OmniDeck) is never removed on uninstall.
  deleteAppDataOnUninstall: false
